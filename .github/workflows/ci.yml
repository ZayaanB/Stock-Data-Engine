name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        build_type: [Debug, Release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DITCH_FETCH_DEPS=ON
          -DITCH_ENABLE_SANITIZERS=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build --output-on-failure
      - name: Verify installed package
        if: matrix.build_type == 'Release'
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/itch-order-book"
          cmake -S tests/package_consumer -B consumer-build \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/itch-order-book"
          cmake --build consumer-build --parallel 2
          ./consumer-build/itch_package_consumer

  thread-sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DITCH_ENABLE_TSAN=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DITCH_BUILD_FUZZERS=ON
      - name: Build
        run: cmake --build build --target itch_decoder_fuzzer --parallel 2
      - name: Fuzz smoke test
        run: ./build/itch_decoder_fuzzer -runs=100000
